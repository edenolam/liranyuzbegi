# Page A propos
about_title: "אודות - לירן יוזבגי"
about_header: "לירן יוזבגי"
about_eyebrow: "סאונד / קולנוע / אמנות עכשווית"
about_intro: "לירן יוזבגי היא אמנית וחוקרת בין-תחומית הפועלת בתחומי הסאונד, המוזיקה, הקולנוע הניסיוני והאמנות העכשווית."
about_practice_title: "פרקטיקה אמנותית"
about_practice_text: "כמלחינה, פסנתרנית, אמנית סאונד ויוצרת קולנוע ניסיוני, היא חוקרת את נקודות המפגש בין מוזיקה, צורות חזותיות, משך ותפיסות של זמן. מחקרה התמקד בהרחבה בקולנוע איטי וביחסיו עם מוזיקה, תרבות אודיו-ויזואלית ואמנות עכשווית. באמצעות מחקר אקדמי ופרקטיקה אמנותית כאחד, היא בוחנת ייצוגים של אובדן, טראומה, אבל וזיכרון, וכן מרחבים מוסדיים של טיפול, דרך העדשה של אסתטיקת האיטיות."
about_research_title: "מחקר"
about_research_text: "לירן השלימה דוקטורט בקומפוזיציה אלקטרואקוסטית ובלימודי קולנוע באוניברסיטת Keele. בנוסף, היא בעלת תואר שני בקומפוזיציה מוזיקלית ותואר שני נפרד בתולדות האמנות, עם התמחות בלימודי אוצרות. כיום היא חוקרת אורחת בבודפשט, ובעבר החזיקה במשרת מחקר אורחת בהולנד."
about_curatorial_title: "פרקטיקה אוצרותית"
about_curatorial_text: "הפרקטיקה האוצרותית היא נדבך מרכזי בעבודתה של לירן. באמצעות יצירת תערוכות, כתיבה אוצרותית ושיתופי פעולה עם מוזיאונים ומוסדות תרבות, היא חוקרת את היחסים בין אמנות עכשווית, קולנוע, סאונד ותרבות חזותית."
about_audiovisual_title: "יחסים אודיו-ויזואליים"
about_audiovisual_text: "בלב עבודתה עומד חקר היחסים האודיו-ויזואליים והאפשרויות היצירתיות הנוצרות מתוך המפגש בין מוזיקה לדימוי החזותי. לירן מתייחסת לקומפוזיציה מוזיקלית ולצורה חזותית כאל ישויות אמנותיות אוטונומיות, שכל אחת מהן מסוגלת להתקיים באופן עצמאי כיצירה שלמה. במקום לראות את היחסים ביניהן במונחים של ליווי או היררכיה, היא חוקרת את האפשרויות האסתטיות שנוצרות מתוך האינטראקציה ביניהן. בעבודתה, מוזיקה ודימוי נכנסים לדיאלוג שבו אף מדיום אינו כפוף לאחר. המפגש ביניהם יוצר יצירה חדשה: צורה אודיו-ויזואלית שאיכויותיה הזמניות והאסתטיות נובעות מן האינטראקציה בין שתי נוכחויות מובחנות אך קשורות זו בזו."
about_education_title: "עריכה, חניכה והוראה"
about_education_text: "לצד פעילותה המחקרית והאמנותית, לירן עבדה במשך למעלה מעשור כעורכת כתיבה אקדמית, מנטורית ומחנכת במדעי הרוח והחברה. באמצעות עריכה, הוראה ותמיכה מחקרית, היא עבדה מקרוב עם סטודנטים, חוקרים ואנשי סגל אקדמי ממגוון רחב של תחומים, ותרמה לפרויקטים אקדמיים בכל שלבי התפתחותם, מרעיונות ראשוניים ועד פרסומים מוגמרים. המפגש עם מגוון רחב כל כך של נושאים ומתודולוגיות הפך לחלק חשוב מתהליך היצירה והמחקר שלה עצמה."
about_presented_text: "סרטיה, עבודות הסאונד שלה ויצירותיה המוזיקליות הוצגו ברחבי העולם בפסטיבלים, תערוכות, קונצרטים ואירועים אקדמיים באירופה ובצפון אמריקה."

