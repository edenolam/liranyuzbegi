# ===============================
# 📄 About Page
# ===============================
about_title: "About - Liran Yuzbegi"
about_header: "Liran Yuzbegi"
about_eyebrow: "Sound / Film / Contemporary Art"
about_intro: "Liran Yuzbegi is an interdisciplinary artist and researcher working across sound, music, experimental film, and contemporary art."
about_practice_title: "Artistic Practice"
about_practice_text: "As a composer, pianist, sound artist, and experimental filmmaker, she explores the intersections of music, visual forms, duration, and perceptions of time. Her research has focused extensively on slow cinema and its relationships with music, audiovisual culture, and contemporary art. Through both scholarly research and artistic practice, she examines representations of loss, trauma, grief, and memory, and institutional spaces of care through the lens of slowness aesthetics."
about_research_title: "Research"
about_research_text: "Liran Yuzbegi completed a PhD in Electroacoustic Music Composition and Film Studies from Keele University. She also has an MA in Music Composition and a separate MA in Art History with a specialisation in Curatorial Studies. She is currently a Guest Researcher in Budapest and previously held a visiting research position in the Netherlands."
about_curatorial_title: "Curatorial Practice"
about_curatorial_text: "Curatorial practice constitutes a central strand of her work. Through exhibition-making, curatorial writing, and collaborations with museums and cultural institutions, she explores the relationships between contemporary art, cinema, sound, and visual culture."
about_audiovisual_title: "Audiovisual Relationships"
about_audiovisual_text: "At the core of her work lies an exploration of audiovisual relationships and the creative possibilities that emerge through the encounter between music and the visual image. She approaches musical composition and visual form as autonomous artistic entities, each capable of existing independently as a complete work. Rather than conceiving their relationship in terms of accompaniment or hierarchy, she investigates the aesthetic possibilities that arise through their interaction. In her work, music and image enter into a dialogue in which neither medium is subordinate to the other. Their encounter generates a new artwork: an audiovisual form whose temporal and aesthetic qualities emerge from the interaction between two distinct yet interconnected presences."
about_education_title: "Editing, Mentoring, and Education"
about_education_text: "Alongside her research and artistic activities, Liran has worked for over a decade as an academic writing editor, mentor, and educator in the humanities and social sciences. Through editing, teaching, and research support, she has worked closely with students, researchers, and academic staff across a wide range of disciplines, contributing to scholarly projects at every stage of development, from early ideas to completed publications. Engaging with such a wide range of subjects and methodologies has become an important part of her own creative and research process."
about_presented_text: "Her films, sound works, and musical compositions have been presented internationally at festivals, exhibitions, concerts, and academic events across Europe and North America."

